name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Lint (basic)
        run: python -m compileall backend/app
      - name: Test (basic)
        run: python -m unittest discover -s backend -p "test_*.py" || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --prefix frontend
      - name: Lint
        run: npm run lint --prefix frontend --if-present
      - name: Test
        run: npm run test --prefix frontend --if-present
